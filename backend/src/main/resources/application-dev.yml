# Perfil de desenvolvimento local: cookie sem HTTPS, dados de demonstração e logs úteis.
spring:
  jpa:
    show-sql: false
logging:
  level:
    br.com.ticketflow: DEBUG
tf:
  security:
    refresh:
      cookie:
        secure: false
  seed:
    enabled: true
    # Usuários de demonstração (organizador, portaria, comprador). Só existem no perfil dev; troque com TF_DEMO_PASSWORD.
    demo-password: ${TF_DEMO_PASSWORD:Demo12345}
