# Perfil de produção. Segredos e endereços SEMPRE por variáveis de ambiente (nunca neste arquivo).
# ProductionSafetyCheck recusa subir com configuração insegura (segredos curtos, CORS aberto, cookie sem HTTPS, perfil dev…).
server:
  # Atrás de um proxy/load balancer: só confia em X-Forwarded-* vindos de proxies internos (faixas privadas, padrão do
  # Tomcat). O limitador de requisições e a auditoria usam o IP real do cliente sem aceitar cabeçalhos forjados.
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: ${TF_TRUSTED_PROXIES:10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2[0-9]|3[0-1])\.\d{1,3}\.\d{1,3}|127\.\d{1,3}\.\d{1,3}\.\d{1,3}}
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    hikari:
      maximum-pool-size: ${TF_DB_POOL_SIZE:20}

logging:
  structured:
    format:
      console: ecs        # JSON (Elastic Common Schema) — requestId do MDC incluído em cada linha
  level:
    root: INFO
    br.com.ticketflow: INFO
    br.com.ticketflow.access: INFO

springdoc:
  api-docs:
    enabled: ${TF_SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${TF_SWAGGER_ENABLED:false}

tf:
  security:
    refresh:
      cookie:
        secure: ${TF_COOKIE_SECURE:true}
  seed:
    enabled: false
