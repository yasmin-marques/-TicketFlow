spring:
  data:
    redis:
      host: ${TF_REDIS_HOST:localhost}
      port: ${TF_REDIS_PORT:6379}
      password: ${TF_REDIS_PASSWORD:}
      timeout: 2s
  kafka:
    bootstrap-servers: ${TF_KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 15000
        request.timeout.ms: 5000
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record
  application:
    name: ticketflow-backend
  datasource:
    url: ${TF_DB_URL:jdbc:postgresql://localhost:5432/ticketflow}
    username: ${TF_DB_USER:ticketflow}
    password: ${TF_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # o schema é evoluído SOMENTE por migrations Flyway
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
  web:
    resources:
      add-mappings: false

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        # Pronto para tráfego só com o banco e o Redis acessíveis; "vivo" não depende de terceiros (evita reinícios em cascata).
        readiness:
          include: readinessState,db,redis
        liveness:
          include: livenessState

logging:
  pattern:
    # Texto legível em desenvolvimento, com o id de correlação; o perfil prod usa JSON (ECS).
    console: "%d{HH:mm:ss.SSS} %5p [%X{requestId:-}] %logger{36} - %m%n"

springdoc:
  api-docs:
    path: /api/docs
    enabled: ${TF_SWAGGER_ENABLED:true}
  swagger-ui:
    path: /api/swagger-ui.html
    enabled: ${TF_SWAGGER_ENABLED:true}

tf:
  security:
    bcrypt-strength: 12
    jwt:
      # Segredo HS256 (>= 32 bytes). Se vazio, um segredo efêmero é gerado a cada execução (só para desenvolvimento).
      secret: ${TF_JWT_SECRET:}
      issuer: ticketflow
      access-ttl: PT15M
    refresh:
      ttl: P7D
      # true: devolve o refresh token também no corpo (apenas para clientes que não usam cookie). Padrão: só cookie.
      expose-in-body: false
      cookie:
        name: tf_refresh
        path: /api/auth
        secure: ${TF_COOKIE_SECURE:true}
        same-site: Lax
    password-reset:
      ttl: PT1H
      expose-token-in-response: false   # nunca true em produção
      link-base-url: ${TF_APP_URL:http://localhost:5173}
    login:
      max-attempts: 5
      window: PT15M
      lockout: PT15M
  cors:
    allowed-origins: ${TF_CORS_ORIGINS:http://localhost:5173}
  catalog:
    origin-lat: -23.5505        # origem padrão de "distância": Praça da Sé, São Paulo
    origin-lng: -46.6333
    nearby-radius-km: 100
    timezone: America/Sao_Paulo
    default-page-size: 12
    max-page-size: 100
  seed:
    enabled: false
    # Usuários de demonstração (só com o perfil dev): vazio = não cria.
    demo-password: ${TF_DEMO_PASSWORD:}
  sales:
    max-per-order: 6
    reservation-ttl: PT10M       # contrato do frontend: 10 minutos
    pix-ttl: PT30M
    boleto-ttl: P3D
    refund-window: P7D           # reembolso até 7 dias após a compra...
    refund-min-lead: P2D         # ...e com mais de 48 h de antecedência do evento
    max-sse-connections: 5000
  payments:
    webhook-secret: ${TF_WEBHOOK_SECRET:}   # HMAC-SHA256 compartilhado com o gateway; vazio = webhooks recusados
    webhook-tolerance: PT5M
  tickets:
    qr-secret: ${TF_QR_SECRET:}              # >= 32 bytes; vazio = chave efêmera (QR deixa de valer ao reiniciar)
  redis:
    enabled: true
  kafka:
    enabled: true
    topic: ticketflow.domain-events
  jobs:
    expiry-enabled: true
    outbox-enabled: true
  rate-limit:
    enabled: ${TF_RATE_LIMIT_ENABLED:true}
    general-per-minute: ${TF_RATE_LIMIT_GENERAL:300}   # por IP
    auth-per-minute: ${TF_RATE_LIMIT_AUTH:30}          # login/cadastro/refresh (o login ainda bloqueia após 5 falhas por e-mail+IP)
    checkin-per-minute: ${TF_RATE_LIMIT_CHECKIN:240}   # leituras da portaria
    webhook-per-minute: ${TF_RATE_LIMIT_WEBHOOK:600}
